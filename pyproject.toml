[project]
name = "multilingual-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaina Batool", email = "b.aaina@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "ollama>=0.6.2",
    "piper-tts>=1.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
multilingual-voice-agent = "multilingual_voice_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "edge-tts>=7.2.8",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
